<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SehatIQ — Sistem Pintar Kesehatan</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<aside id="side">
  <div class="brand"><span id="lg"></span>SehatIQ</div>
  <nav id="nav"></nav>
  <div class="sf">
    <div class="usr" id="usr"></div>
    <button class="btn sm" id="theme"><i data-ic="sun"></i> Ganti Tema</button>
    <button class="btn sm" id="exp"><i data-ic="download"></i> Ekspor Data</button>
    <label class="btn sm" style="cursor:pointer;margin:0"><i data-ic="upload"></i> Impor<input type="file" id="imp" accept=".json" hidden></label>
    <button class="btn sm" id="out"><i data-ic="logout"></i> Keluar</button>
  </div>
</aside>
<main>
  <header><button id="menu" class="btn sm" data-ic="menu"></button><h1 id="title"></h1><span id="clock"></span></header>
  <section id="view"></section>
  <footer><i data-ic="alert" data-s="14"></i> SehatIQ adalah alat bantu edukasi, bukan pengganti diagnosis dokter. Data tersimpan di database MySQL Anda.</footer>
</main>
<div id="toast"></div>
<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script src="js/charts.js"></script>
<script src="js/modules/dashboard.js"></script>
<script src="js/modules/symptom.js"></script>
<script src="js/modules/vitals.js"></script>
<script src="js/modules/meds.js"></script>
<script src="js/modules/appts.js"></script>
<script src="js/modules/records.js"></script>
<script src="js/modules/calc.js"></script>
<script src="js/modules/journal.js"></script>
<script src="js/modules/chat.js"></script>
<script src="js/modules/emergency.js"></script>
<script src="js/app.js"></script>
</body>
</html>
